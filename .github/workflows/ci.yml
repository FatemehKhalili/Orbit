name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://orbit:ci-only-password@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Production images
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build the runtime target (not pushed)
        run: docker build --target runtime --tag orbit-${{ matrix.app }}:ci apps/${{ matrix.app }}
      - name: Image starts and passes its health check
        run: ./scripts/check-image.sh ${{ matrix.app }} orbit-${{ matrix.app }}:ci

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/setup-env.sh
      - run: docker compose up --build --detach --wait
      - run: ./scripts/smoke-test.sh
      - name: Database is at the latest migration
        run: docker compose exec -T api alembic check
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  production:
    name: Production stack
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      COMPOSE_FILE: compose.production.yml:.github/compose.production.ci.yml
      ORBIT_SMOKE_EMAIL: owner@example.com
      ORBIT_SMOKE_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v5
      - run: ./scripts/setup-env.sh
      - name: Only the web app is published, and only on 127.0.0.1
        run: |
          docker compose -f compose.production.yml --profile https config --format json \
            | jq -e '[.services | to_entries[] | select(.value.ports) | {service: .key, ip: [.value.ports[].host_ip]}]
                     | sort_by(.service) == [{service: "https", ip: ["127.0.0.1", "127.0.0.1"]}, {service: "web", ip: ["127.0.0.1"]}]'
      # The guide's own command, on this fresh runner, with nothing but the generated .env.
      - name: Install exactly as docs/deployment/README.md says
        run: |
          docker compose -f compose.production.yml up -d --build --wait
          docker compose -f compose.production.yml ps -a
          test "$(docker compose -f compose.production.yml ps -a --format '{{.ExitCode}}' migrate)" = 0
          curl -fsS --max-time 10 http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl -fsS --max-time 10 http://127.0.0.1:3000/login | grep -q 'Sign in'
          curl -fsS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ | grep -q 307
      - name: From the host, only the web app answers
        run: |
          docker ps --format '{{.Names}} {{.Ports}}' | tee "$RUNNER_TEMP/ports"
          test "$(grep -c -- '->' "$RUNNER_TEMP/ports")" = 1
          grep -q '^orbit-production-web-1 127.0.0.1:3000->3000/tcp$' "$RUNNER_TEMP/ports"
          if curl -sS --max-time 3 http://127.0.0.1:8000/health; then exit 1; fi
          if (exec 3<>/dev/tcp/127.0.0.1/5432) 2> /dev/null; then exit 1; fi
          echo "API (8000) and database (5432) are not reachable from the host"
      # Then publish the API on 127.0.0.1 (CI-only override) so the smoke test can use it.
      - run: docker compose up --build --detach --wait
      - name: Create the owner
        run: |
          printf '%s\n' "$ORBIT_SMOKE_PASSWORD" \
            | docker compose exec -T api python -m app.cli create-owner \
                --email "$ORBIT_SMOKE_EMAIL" --name Owner --password-stdin
      - run: ./scripts/smoke-test.sh
      - name: API documentation is off in production
        run: test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = 404
      - name: Database is at the latest migration
        run: docker compose exec -T api alembic check
      - name: HTTPS profile with Caddy's local certificate authority
        env:
          ORBIT_TRUSTED_PROXY: "true"
          ORBIT_HTTPS_PORT: "8443"
          ORBIT_HTTP_PORT: "8080"
        run: |
          docker compose --profile https up --detach --wait
          # Caddy writes its local root certificate when it issues the first certificate.
          for _ in $(seq 30); do
            docker compose cp https:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt" && break
            sleep 1
          done
          CURL_CA_BUNDLE="$RUNNER_TEMP/caddy-root.crt" WEB_URL=https://localhost:8443 ./scripts/smoke-test.sh
      - if: failure()
        run: docker compose --profile https logs
      - if: always()
        run: docker compose --profile https down --volumes

  restore:
    name: Backup and restore
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      COMPOSE_FILE: compose.production.yml:.github/compose.production.ci.yml
      ORBIT_CI_EMAIL: owner@example.com
      ORBIT_CI_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v5
      - run: echo "BACKUPS=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - run: ./scripts/setup-env.sh
      - run: docker compose up --build --detach --wait
      - name: Seed data, sign in, record what is there
        run: |
          .github/scripts/orbit-data.sh seed
          token=$(.github/scripts/orbit-data.sh token)
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          .github/scripts/orbit-data.sh export "$token" > "$RUNNER_TEMP/export-before.json"
          ./scripts/db-fingerprint.sh | tee "$RUNNER_TEMP/fingerprint-before.txt"
      - name: Back up while Orbit runs
        run: ./scripts/backup.sh "$BACKUPS" && ls -l "$BACKUPS"
      - name: Lose everything (containers and the data volume)
        run: docker compose down --volumes
      - name: Restore into a fresh install
        run: |
          docker compose up --detach --wait db
          ./scripts/restore.sh "$BACKUPS"/orbit-*.dump
          ./scripts/db-fingerprint.sh | diff "$RUNNER_TEMP/fingerprint-before.txt" -
      - run: docker compose up --detach --wait
      - name: The restored data, password and sessions all work
        run: |
          .github/scripts/orbit-data.sh export "$TOKEN" | diff "$RUNNER_TEMP/export-before.json" -
          .github/scripts/orbit-data.sh token > /dev/null
          docker compose exec -T api alembic check
      # `! cmd` does not stop a step under `set -e`, hence the if/exit form.
      # With --force and the name typed, so only the check under test can refuse.
      - name: Restore refuses to run while the app is up
        run: |
          if echo orbit | ./scripts/restore.sh --force "$BACKUPS"/orbit-*.dump 2> "$RUNNER_TEMP/err"; then exit 1; fi
          grep -q "stop the app first" "$RUNNER_TEMP/err"
      - name: Restore refuses a damaged file
        run: |
          docker compose stop web api
          cp "$BACKUPS"/orbit-*.dump "$RUNNER_TEMP/damaged.dump"
          sed 's/ .*/  damaged.dump/' "$BACKUPS"/orbit-*.dump.sha256 > "$RUNNER_TEMP/damaged.dump.sha256"
          printf x >> "$RUNNER_TEMP/damaged.dump"
          if echo orbit | ./scripts/restore.sh --force "$RUNNER_TEMP/damaged.dump" 2> "$RUNNER_TEMP/err"; then exit 1; fi
          grep -q "does not match its checksum" "$RUNNER_TEMP/err"
      - name: Restore never replaces data without --force and the typed name
        run: |
          if ./scripts/restore.sh "$BACKUPS"/orbit-*.dump 2> "$RUNNER_TEMP/err"; then exit 1; fi
          grep -q "refusing to replace it" "$RUNNER_TEMP/err"
          if echo wrong | ./scripts/restore.sh --force "$BACKUPS"/orbit-*.dump 2> "$RUNNER_TEMP/err"; then exit 1; fi
          grep -q "not confirmed" "$RUNNER_TEMP/err"
          echo orbit | ./scripts/restore.sh --force "$BACKUPS"/orbit-*.dump
          ./scripts/db-fingerprint.sh | diff "$RUNNER_TEMP/fingerprint-before.txt" -
          docker compose exec -T db psql -U orbit -d postgres -tAc \
            "SELECT datname FROM pg_database WHERE datname LIKE 'orbit_before_restore_%'" | grep -q .
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  upgrade:
    name: Upgrade from v0.6.0-phase6 and roll back
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      # Both releases run their own production stack. They share the project name
      # (orbit-production), so the new code starts on the old release's data volume.
      COMPOSE_FILE: compose.production.yml:.github/compose.production.ci.yml
      ORBIT_CI_EMAIL: owner@example.com
      ORBIT_CI_PASSWORD: ci-only-owner-password
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          echo "OLD=$RUNNER_TEMP/v0.6.0-phase6" >> "$GITHUB_ENV"
          echo "BACKUPS=$RUNNER_TEMP/backups" >> "$GITHUB_ENV"
      - name: Run v0.6.0-phase6 (its production Compose setup)
        run: |
          git worktree add "$OLD" v0.6.0-phase6
          (cd "$OLD" && ./scripts/setup-env.sh && docker compose up --build --detach --wait)
          cp "$OLD/.env" .env
      - name: Seed data on v0.6.0 and back it up, as the upgrade guide says
        run: |
          export ORBIT_COMPOSE_FILE="$OLD/compose.production.yml"
          .github/scripts/orbit-data.sh seed
          echo "TOKEN=$(.github/scripts/orbit-data.sh token)" >> "$GITHUB_ENV"
          ./scripts/db-fingerprint.sh | tee "$RUNNER_TEMP/v06.txt"
          ./scripts/backup.sh "$BACKUPS"
      - name: Upgrade in place (same data volume, new code)
        run: |
          (cd "$OLD" && docker compose down)
          docker compose up --build --detach --wait
          test "$(docker compose ps -a --format '{{.ExitCode}}' migrate)" = 0
          docker compose exec -T api alembic check
      - name: Upgraded data is unchanged, and the old session and password work
        run: |
          ./scripts/db-fingerprint.sh | diff "$RUNNER_TEMP/v06.txt" -
          .github/scripts/orbit-data.sh export "$TOKEN" | jq -e '(.shopping.items | length) == 40 and (.habits.habits | map(.check_ins | length) | add) == 1004'
          .github/scripts/orbit-data.sh token > /dev/null
      - name: Smoke test on the upgraded data
        env:
          ORBIT_SMOKE_EMAIL: owner@example.com
          ORBIT_SMOKE_PASSWORD: ci-only-owner-password
        run: ./scripts/smoke-test.sh
      - name: Roll back to v0.6.0 by restoring the pre-upgrade backup
        run: |
          docker compose down
          (cd "$OLD" && docker compose up --detach --wait db)
          echo orbit | ./scripts/restore.sh --force "$BACKUPS"/orbit-*.dump
          ./scripts/db-fingerprint.sh | diff "$RUNNER_TEMP/v06.txt" -
          (cd "$OLD" && docker compose up --detach --wait)
          .github/scripts/orbit-data.sh token > /dev/null
          (cd "$OLD" && docker compose exec -T api alembic check)
      - if: failure()
        run: |
          docker compose logs
          (cd "$OLD" && docker compose logs) || true
      - if: always()
        run: |
          docker compose down --volumes || true
          (cd "$OLD" && docker compose down --volumes) || true
