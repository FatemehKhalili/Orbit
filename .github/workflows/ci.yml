name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: orbit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://orbit:ci-only-password@localhost:5432/orbit_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest

  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Production images
    runs-on: ubuntu-latest
    needs: [api, web]
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build the runtime target (not pushed)
        run: docker build --target runtime --tag orbit-${{ matrix.app }}:ci apps/${{ matrix.app }}
      - name: Image starts and passes its health check
        run: ./scripts/check-image.sh ${{ matrix.app }} orbit-${{ matrix.app }}:ci

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/setup-env.sh
      - run: docker compose up --build --detach --wait
      - run: ./scripts/smoke-test.sh
      - name: Database is at the latest migration
        run: docker compose exec -T api alembic check
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
