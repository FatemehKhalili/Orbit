[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<3",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15,<3",
    "alembic>=1.20,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "httpx2>=2.13,<3",
    "ruff>=0.16,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running PostgreSQL (set TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
