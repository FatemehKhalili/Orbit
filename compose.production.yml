# Orbit production deployment (ADR 0009, docs/deployment/README.md).
#
#   ./scripts/setup-env.sh                                   # once: .env with a DB password
#   docker compose -f compose.production.yml up -d --build   # build, migrate, start
#
# Private by default: only the web app is published, and only on 127.0.0.1. The API and
# the database are reachable inside this Compose network alone. To reach Orbit from other
# devices, put HTTPS in front: the opt-in `https` profile below, or your own proxy.
#
# The development setup (docker-compose.yml) is separate and keeps its own data.
name: orbit-production

x-api: &api
  build:
    context: ./apps/api
    target: runtime
  image: orbit-api:local
  environment:
    ORBIT_ENV: production
    ORBIT_TIMEZONE: ${ORBIT_TIMEZONE-UTC}
    DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/setup-env.sh)}@db:5432/${POSTGRES_DB:-orbit}
    ORBIT_SESSION_TTL_DAYS: ${ORBIT_SESSION_TTL_DAYS:-30}
    ORBIT_LOGIN_FREE_ATTEMPTS: ${ORBIT_LOGIN_FREE_ATTEMPTS:-5}
    ORBIT_LOGIN_GLOBAL_FREE_ATTEMPTS: ${ORBIT_LOGIN_GLOBAL_FREE_ATTEMPTS:-100}
    ORBIT_LOGIN_BLOCK_SECONDS: ${ORBIT_LOGIN_BLOCK_SECONDS:-30}
    ORBIT_LOGIN_MAX_BLOCK_SECONDS: ${ORBIT_LOGIN_MAX_BLOCK_SECONDS:-900}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/setup-env.sh)}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    volumes:
      - orbit-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies migrations once, then exits. The API starts only after it succeeds, and
  # never migrates on its own (ADR 0004).
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./apps/web
      target: runtime
    image: orbit-web:local
    restart: unless-stopped
    environment:
      ORBIT_API_URL: http://api:8000
      # Only behind a proxy that sets X-Forwarded-For (the https profile does).
      ORBIT_TRUSTED_PROXY: ${ORBIT_TRUSTED_PROXY:-false}
      ORBIT_INSECURE_COOKIES: ${ORBIT_INSECURE_COOKIES:-false}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Opt-in HTTPS reverse proxy (R5): docker compose -f compose.production.yml
  #   --profile https up -d. Caddy terminates HTTPS for ORBIT_DOMAIN with its own local
  # certificate authority by default (ORBIT_TLS=internal), or a public certificate
  # (ORBIT_TLS=acme) when the domain is reachable from the internet. It listens on
  # ORBIT_HTTPS_BIND, 127.0.0.1 unless you choose to open it to your network.
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      ORBIT_DOMAIN: ${ORBIT_DOMAIN:-localhost}
      ORBIT_TLS: ${ORBIT_TLS:-internal}
    ports:
      - "${ORBIT_HTTPS_BIND:-127.0.0.1}:${ORBIT_HTTPS_PORT:-443}:443"
      - "${ORBIT_HTTPS_BIND:-127.0.0.1}:${ORBIT_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  orbit-data:
  caddy-data:
